# AnySearch evaluation matrix: seven benchmarks at B=1..8.
# EVAL_DATA_DIR must contain one canonical Parquet per dataset.
eval:
  defaults:
    input_key: question
    label_key: label
    metadata_key: metadata
    n_samples_per_eval_prompt: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    max_response_len: 4096
  datasets:
    - name: nq_b1
      path: ${oc.env:EVAL_DATA_DIR}/nq.parquet
      custom_generate_function_path: examples.anysearch.slime_ext.rollout.generate
      metadata_overrides: {dataset: nq, budget: 1, evaluation: true}
    - name: nq_b2
      path: ${oc.env:EVAL_DATA_DIR}/nq.parquet
      custom_generate_function_path: examples.anysearch.slime_ext.rollout.generate
      metadata_overrides: {dataset: nq, budget: 2, evaluation: true}
    - name: nq_b3
      path: ${oc.env:EVAL_DATA_DIR}/nq.parquet
      custom_generate_function_path: examples.anysearch.slime_ext.rollout.generate
      metadata_overrides: {dataset: nq, budget: 3, evaluation: true}
    - name: nq_b4
      path: ${oc.env:EVAL_DATA_DIR}/nq.parquet
      custom_generate_function_path: examples.anysearch.slime_ext.rollout.generate
      metadata_overrides: {dataset: nq, budget: 4, evaluation: true}
    - name: nq_b5
      path: ${oc.env:EVAL_DATA_DIR}/nq.parquet
      custom_generate_function_path: examples.anysearch.slime_ext.rollout.generate
      metadata_overrides: {dataset: nq, budget: 5, evaluation: true}
    - name: nq_b6
      path: ${oc.env:EVAL_DATA_DIR}/nq.parquet
      custom_generate_function_path: examples.anysearch.slime_ext.rollout.generate
      metadata_overrides: {dataset: nq, budget: 6, evaluation: true}
    - name: nq_b7
